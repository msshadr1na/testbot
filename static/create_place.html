<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новое помещение</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Russo One', sans-serif; min-height: 100vh; color: #1f1f35; }
        .bg-gradient { position: fixed; inset: 0; background: linear-gradient(127.42deg, #CBBAFD 9.38%, #CBE949 58.67%); z-index: -1; }
        .container { width: 100%; max-width: 375px; margin: 0 auto; padding: 20px 14px 24px; min-height: 100vh; }
        .topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
        .back-btn {
            background: #CBE949;
            width: 50px;
            height: 50px;
            border-radius: 28px;
            border: none;
            font-size: 24px;
            font-weight: bold;
            color: #000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }
        .page-label {
            font-size: 16px;
            letter-spacing: 0.6px;
            opacity: 0.75;
            text-align: right;
            flex: 1;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .panel {
            position: relative;
            width: 100%;
            min-height: 400px;
            background: #EFEEFC;
            border-radius: 20px;
            padding: 15px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        input {
            width: 100%;
            height: 67px;
            font-size: 14px;
            border-radius: 16px;
            border: 2px solid #A3A3A3;
            padding: 0 12px;
            font-family: inherit;
            display: block;
            margin-left: auto;
            margin-right: auto;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            outline: none;
        }
        input:focus {
            border-color: #9B7FCC;
            color: #41404E;
            box-shadow: 0 0 0 4px rgba(155, 127, 204, 0.25);
        }
        input::placeholder {
            color: #A3A3A3;
            font-size: 12px;
            opacity: 1;
        }
        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: fit-content;
            height: 56px;
            padding: 15px 27px;
            border: none;
            border-radius: 20px;
            font-family: 'Russo One', sans-serif;
            font-size: 18px;
            line-height: 26px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #000000;
            cursor: pointer;
            margin-top: 8px;
            box-sizing: border-box;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn--purple {
            background: #CBBAFD;
            box-shadow: 0px 6px 0px #9B7FCC;
        }
        .btn--purple:hover {
            transform: scale(1.02);
            box-shadow: 0px 6px 0px #9B7FCC, 0 15px 6px rgba(0, 0, 0, 0.3);
        }
        .btn--purple:active {
            transform: translateY(4px);
            box-shadow: 0px 2px 0px #9B7FCC;
        }
        .status {
            width: 100%;
            min-height: 20px;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
            color: #41404E;
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="container">
        <div class="topbar">
            <button class="back-btn" id="back-btn">←</button>
            <div class="page-label">НОВОЕ ПОМЕЩЕНИЕ</div>
        </div>
        <div class="panel">
            <input id="name-input" maxlength="100" placeholder="Название нового помещения">
            <button class="btn btn--purple" style="background:#CBBAFD;" id="create-btn">Создать помещение</button>
            <div class="status" id="status"></div>
        </div>
    </div>
    <script>
        Telegram.WebApp.ready();
        const params = new URLSearchParams(window.location.search);
        const orgId = params.get("org_id");
        const input = document.getElementById("name-input");
        const statusEl = document.getElementById("status");

        function setStatus(text, isError = false) {
            statusEl.textContent = text || "";
            statusEl.style.color = isError ? "#d32f2f" : "#5a5a5a";
        }

        document.getElementById("create-btn").onclick = async () => {
            const name = input.value.trim();
            if (name.length < 2) return setStatus("Название должно быть не короче 2 символов", true);

            const res = await fetch(`/api/v1/org/${orgId}/places?name=${encodeURIComponent(name)}`, { method: "POST" });
            const data = await res.json();

            if (!res.ok) return setStatus(data.detail || "Не удалось создать помещение", true);

            window.location.href = `/app/org_places.html?org_id=${orgId}&v=2`;
        };

        document.getElementById("back-btn").onclick = () => {
            window.location.href = `/app/org_places.html?org_id=${orgId}&v=2`;
        };
    </script>
</body>
</html>
