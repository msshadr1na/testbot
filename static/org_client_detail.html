<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Клиент</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Russo One', sans-serif; min-height: 100vh; color: #1f1f35; }
        .bg-gradient { position: fixed; inset: 0; background: linear-gradient(127.42deg, #CBBAFD 9.38%, #CBE949 58.67%); z-index: -1; }

        .container { width: 100%; max-width: 375px; margin: 0 auto; padding: 20px 14px 24px; min-height: 100vh; }

        .topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
        .back-btn {
            background: #CBE949;
            width: 50px;
            height: 50px;
            border-radius: 28px;
            border: none;
            font-size: 24px;
            font-weight: bold;
            color: #000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }
        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 rgba(64, 52, 96, 0.22), 0 10px 18px rgba(26, 15, 52, 0.18), 0 15px 6px rgba(26, 15, 52, 0.22);
        }
        .back-btn:active {
            transform: translateY(1px);
            box-shadow: 0 4px 0 rgba(64, 52, 96, 0.22), 0 7px 12px rgba(26, 15, 52, 0.15);
        }
        .page-label {
            font-size: 16px; letter-spacing: 0.6px; opacity: 0.75; text-align: right; flex: 1;
            text-transform: uppercase; white-space: nowrap;
        }
        .info-card {
            background: #EFEEFC; border-radius: 20px; padding: 22px 18px; margin-bottom: 18px;
            box-shadow: 0 12px 20px rgba(38, 30, 67, 0.13); border: 1px solid #fff;
        }
        .client-name { font-size: 19px; line-height: 1.1; text-transform: uppercase; margin-bottom: 8px; color: #0b0b11; }
        .client-phone { font-size: 14px; opacity: 0.7; }
        .delete-btn {
            width: 100%; height: 56px; border: none; border-radius: 20px;
            font-family: 'Russo One', sans-serif; font-size: 18px; text-transform: uppercase;
            background: #F8CECC; box-shadow: 0px 6px 0px #C5928F;
            color: #000; cursor: pointer; transition: transform 0.1s ease;
            margin-top: 10px;
        }
        .delete-btn:hover { transform: scale(1.02); }
        .delete-btn:active { transform: translateY(4px); box-shadow: 0px 2px 0px #C5928F; }

        .status { font-size: 13px; min-height: 18px; color: #5a5a5a; margin-top: 8px; text-align: center; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.3); z-index: 1000;
            display: none; align-items: center; justify-content: center; opacity: 0;
            transition: opacity 0.2s ease;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal {
            width: 90%; max-width: 360px; background: #D9D9D9; border-radius: 20px;
            padding: 28px 18px 20px; display: flex; flex-direction: column;
            align-items: center; gap: 16px;
        }
        .modal-title { font-size: 18px; text-transform: uppercase; text-align: center; }
        .modal-btn {
            width: 220px; height: 48px; border: none; border-radius: 18px;
            font-family: inherit; font-size: 16px; cursor: pointer; text-transform: uppercase;
        }
        .modal-btn--delete { background: #F8CECC; box-shadow: 0 6px 0 #C5928F; }
        .modal-btn--cancel { background: #CBE949; box-shadow: 0 6px 0 #A3B83A; }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="container">
        <div class="topbar">
            <button class="back-btn" id="back-btn">←</button>
            <div class="page-label">КЛИЕНТ</div>
        </div>

        <div class="info-card" id="info-card">
            <div class="client-name" id="c-name">Загрузка...</div>
            <div class="client-phone" id="c-phone">...</div>
        </div>

        <button class="delete-btn" id="delete-btn">Удалить клиента</button>
        <div id="status" class="status"></div>
    </div>

    <div class="modal-overlay" id="delete-modal">
        <div class="modal">
            <div class="modal-title">Подтвердите удаление</div>
            <button class="modal-btn modal-btn--delete" id="confirm-delete-btn">Удалить</button>
            <button class="modal-btn modal-btn--cancel" id="cancel-delete-btn">Отмена</button>
        </div>
    </div>

    <script>
        Telegram.WebApp.ready();
        const params = new URLSearchParams(window.location.search);
        const orgId = params.get("org_id");
        const clientId = params.get("client_id");

        const cNameEl = document.getElementById("c-name");
        const cPhoneEl = document.getElementById("c-phone");
        const statusEl = document.getElementById("status");
        const deleteModal = document.getElementById("delete-modal");

        function setStatus(text, isError = false) {
            statusEl.textContent = text || "";
            statusEl.style.color = isError ? "#d32f2f" : "#5a5a5a";
        }

        async function loadDetail() {
            try {
                const res = await fetch(`/api/v1/org/${orgId}/clients/${clientId}`);
                if (!res.ok) throw new Error("Не удалось загрузить данные");
                const data = await res.json();

                cNameEl.textContent = data.full_name || "Без имени";
                cPhoneEl.textContent = data.phone ? `${data.phone}` : "Телефон не указан";
            } catch (e) {
                cNameEl.textContent = "Ошибка";
                setStatus(e.message, true);
            }
        }

        document.getElementById("delete-btn").onclick = () => {
            deleteModal.classList.add("active");
        };
        document.getElementById("cancel-delete-btn").onclick = () => {
            deleteModal.classList.remove("active");
        };
        deleteModal.onclick = (e) => {
            if (e.target === deleteModal) deleteModal.classList.remove("active");
        };
        document.getElementById("confirm-delete-btn").onclick = async () => {
            deleteModal.classList.remove("active");
            const res = await fetch(`/api/v1/org/${orgId}/clients/${clientId}`, { method: "DELETE" });
            if (res.ok) {
                window.location.href = `/app/org_clients.html?org_id=${orgId}&v=2`;
            } else {
                setStatus("Не удалось удалить клиента", true);
            }
        };
        document.getElementById("back-btn").onclick = () => {
            window.location.href = `/app/org_clients.html?org_id=${orgId}&v=2`;
        };

        loadDetail();
    </script>
</body>
</html>
